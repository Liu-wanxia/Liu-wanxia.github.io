<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇小游戏（WASD版）</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        canvas {
            background-color: #000;
            border: 2px solid #333;
        }
        .score {
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }
        .controls {
            margin-top: 10px;
            color: #555;
        }
        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>贪吃蛇小游戏（WASD版）</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="score">得分: <span id="score">0</span></div>
    <div class="controls">使用 WASD 键控制方向</div>

    <!-- 开始游戏界面 -->
    <div id="startScreen">
        <h2>点击此处开始游戏</h2>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const startScreen = document.getElementById("startScreen");

        const boxSize = 20; // 每个格子的大小
        const rows = canvas.height / boxSize;
        const cols = canvas.width / boxSize;

        let snake = [{ x: 10, y: 10 }]; // 初始蛇身
        let food = { x: 5, y: 5 }; // 食物位置
        let direction = "RIGHT"; // 初始方向
        let score = 0;
        let gameSpeed = 150; // 初始速度（毫秒）
        let gameInterval;
        let isGameRunning = false;

        // 随机生成食物位置
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * cols),
                y: Math.floor(Math.random() * rows)
            };
            // 确保食物不会生成在蛇身上
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    return generateFood();
                }
            }
        }

        // 绘制游戏画面
        function draw() {
            // 清空画布
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制蛇
            ctx.fillStyle = "lime";
            for (let segment of snake) {
                ctx.fillRect(segment.x * boxSize, segment.y * boxSize, boxSize, boxSize);
            }

            // 绘制食物
            ctx.fillStyle = "red";
            ctx.fillRect(food.x * boxSize, food.y * boxSize, boxSize, boxSize);

            // 更新分数
            scoreElement.textContent = score;
        }

        // 更新游戏状态
        function update() {
            // 移动蛇
            const head = { ...snake[0] };

            switch (direction) {
                case "UP":
                    head.y--;
                    break;
                case "DOWN":
                    head.y++;
                    break;
                case "LEFT":
                    head.x--;
                    break;
                case "RIGHT":
                    head.x++;
                    break;
            }

            // 检查是否撞墙或撞到自己
            if (
                head.x < 0 || head.x >= cols ||
                head.y < 0 || head.y >= rows ||
                snake.some(segment => segment.x === head.x && segment.y === head.y)
            ) {
                gameOver();
                return;
            }

            // 添加到蛇头
            snake.unshift(head);

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score++;
                // 每得5分加速一次（可选）
                if (score % 5 === 0 && gameSpeed > 50) {
                    gameSpeed -= 10;
                    clearInterval(gameInterval);
                    gameInterval = setInterval(gameLoop, gameSpeed);
                }
                generateFood();
            } else {
                // 如果没吃到食物，移除蛇尾
                snake.pop();
            }
        }

        // 游戏结束
        function gameOver() {
            clearInterval(gameInterval);
            isGameRunning = false;
            alert("游戏结束！得分: " + score);
            startScreen.style.display = "block"; // 显示开始界面
        }

        // 重置游戏
        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            direction = "RIGHT";
            score = 0;
            gameSpeed = 150;
            generateFood();
        }

        // 键盘控制（WASD）
        document.addEventListener("keydown", (e) => {
            if (!isGameRunning) return; // 游戏未开始时忽略按键
            
            switch (e.key.toLowerCase()) {
                case "w":
                    if (direction !== "DOWN") direction = "UP";
                    break;
                case "s":
                    if (direction !== "UP") direction = "DOWN";
                    break;
                case "a":
                    if (direction !== "RIGHT") direction = "LEFT";
                    break;
                case "d":
                    if (direction !== "LEFT") direction = "RIGHT";
                    break;
            }
        });

        // 游戏主循环
        function gameLoop() {
            update();
            draw();
        }

        // 点击开始游戏
        startScreen.addEventListener("click", () => {
            startScreen.style.display = "none";
            resetGame();
            isGameRunning = true;
            gameInterval = setInterval(gameLoop, gameSpeed);
        });

        // 初始化游戏（不自动开始）
        generateFood();
        draw(); // 初始绘制静态画面
    </script>
</body>
</html>
